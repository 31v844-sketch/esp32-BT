<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 人物重心與獨立機械尾巴平衡系統 (支援 ESP32 BLE)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121629;
            color: white;
            user-select: none;
        }
        #ui-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 310px;
            background: rgba(18, 22, 41, 0.9);
            backdrop-filter: blur(8px);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(76, 201, 240, 0.25);
            z-index: 10;
        }
        h3 { margin: 0 0 12px 0; font-size: 16px; color: #4cc9f0; }
        .control-group { margin-bottom: 14px; }
        label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: #ccc; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4cc9f0; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 14px; }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            background: #232946;
            color: white;
            transition: 0.2s;
        }
        button:hover { background: #333b63; }
        button.active { background: #4cc9f0; color: #000; font-weight: bold; }
        #bleBtn {
            width: 100%;
            padding: 10px;
            background: #00b4d8;
            color: #000;
            font-weight: bold;
            margin-top: 6px;
        }
        #bleBtn.connected { background: #2ec4b6; color: #000; }
        #telemetry {
            margin-top: 10px;
            font-size: 12px;
            color: #90e0ef;
            background: rgba(0,0,0,0.45);
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            line-height: 1.5;
        }
        .hint {
            margin-top: 8px;
            font-size: 11px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="ui-panel">
    <h3>重心平衡機械尾巴系統</h3>
    
    <div class="btn-group">
        <button id="poseIdle" class="active">待機歸零</button>
        <button id="poseLeanL">左側傾測試</button>
        <button id="poseLeanR">右側傾測試</button>
    </div>

    <div class="control-group">
        <label><span>側向傾斜 (Roll 左右重心)</span><span id="rollVal">0°</span></label>
        <input type="range" id="rollSlider" min="-45" max="45" value="0">
    </div>

    <div class="control-group">
        <label><span>前後傾角 (Pitch 俯仰重心)</span><span id="pitchVal">0°</span></label>
        <input type="range" id="pitchSlider" min="-35" max="35" value="0">
    </div>

    <div class="control-group">
        <label><span>平衡補償增益 (尾巴反應靈敏度)</span><span id="gainVal">1.5x</span></label>
        <input type="range" id="gainSlider" min="0.5" max="2.5" step="0.1" value="1.5">
    </div>

    <button id="bleBtn">連線 ESP32-C3 同步實體尾巴</button>
    <div id="telemetry">
        系統狀態：待機靜止 (重心置中)<br>
        舵機角度 -> 水平: 90° | 垂直: 90°
    </div>
    <div class="hint">左側：人物姿態 ｜ 右側：獨立機械尾巴<br>按住滑鼠左鍵拖曳可旋轉 3D 視角</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // ================= 1. 3D 場景與滑鼠視角控制 =================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x121629, 0.025);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    let camAngleY = 0.35; // 預設從前側斜角同時觀察人物與獨立尾巴
    let camAngleX = 0.35;
    let camDist = 5.6;

    function updateCameraPosition() {
        camera.position.x = camDist * Math.sin(camAngleY) * Math.cos(camAngleX);
        camera.position.y = 1.2 + camDist * Math.sin(camAngleX);
        camera.position.z = camDist * Math.cos(camAngleY) * Math.cos(camAngleX);
        camera.lookAt(0, 1.0, 0);
    }
    updateCameraPosition();

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 滑鼠拖曳旋轉視角
    let isDragging = false, prevX = 0, prevY = 0;
    renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        camAngleY -= (e.clientX - prevX) * 0.01;
        camAngleX = THREE.MathUtils.clamp(camAngleX + (e.clientY - prevY) * 0.01, -0.2, 1.2);
        prevX = e.clientX; prevY = e.clientY;
        updateCameraPosition();
    });

    // 燈光與地板網格
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 12, 6);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(16, 16, 0x4cc9f0, 0x232946);
    scene.add(gridHelper);

    // ================= 2. 左側：建立獨立人物模型 (X = -1.3) =================
    const charRoot = new THREE.Group();
    charRoot.position.set(-1.3, 0, 0);
    scene.add(charRoot);

    // 人物腳底中心垂直參考線
    const refLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 2.7, 0)]);
    const refLineMat = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.45 });
    charRoot.add(new THREE.Line(refLineGeo, refLineMat));

    const pivotGroup = new THREE.Group(); // 人物傾斜支點
    charRoot.add(pivotGroup);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a86ff, roughness: 0.4 });
    const headMat = new THREE.MeshStandardMaterial({ color: 0x90e0ef, roughness: 0.3 });

    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.22), bodyMat);
    leftLeg.position.set(-0.2, 0.375, 0);
    pivotGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.22), bodyMat);
    rightLeg.position.set(0.2, 0.375, 0);
    pivotGroup.add(rightLeg);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.0, 0.38), bodyMat);
    torso.position.y = 1.25;
    pivotGroup.add(torso);

    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 0.18), bodyMat);
    leftArm.position.set(-0.52, 1.28, 0);
    pivotGroup.add(leftArm);

    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.85, 0.18), bodyMat);
    rightArm.position.set(0.52, 1.28, 0);
    pivotGroup.add(rightArm);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
    head.position.y = 2.05;
    pivotGroup.add(head);

    // ================= 3. 右側：獨立機械尾巴模擬座 (X = +1.3) =================
    const tailStandGroup = new THREE.Group();
    tailStandGroup.position.set(1.3, 0, 0.4); // 獨立放在右側，略微往前讓尾巴向後延伸居中
    scene.add(tailStandGroup);

    // 機械底座與立柱 (模擬穿戴腰帶 / 測試治具)
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, metalness: 0.6, roughness: 0.3 });
    const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.1, 24), baseMat);
    basePlate.position.y = 0.05;
    tailStandGroup.add(basePlate);

    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.9, 16), baseMat);
    pillar.position.y = 0.5;
    tailStandGroup.add(pillar);

    // 舵機雲台核心
    const servoHousing = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.28, 0.32), new THREE.MeshStandardMaterial({ color: 0x00b4d8, metalness: 0.4 }));
    servoHousing.position.y = 0.95;
    tailStandGroup.add(servoHousing);

    // 科技感機械尾巴材質 (銀灰骨架 + 亮青色關節)
    const tailArmorMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.5, roughness: 0.25 });
    const tailJointMat = new THREE.MeshStandardMaterial({ color: 0x00f5d4, emissive: 0x005f73, roughness: 0.3 });

    const tailSegments = [];
    const segmentCount = 6;
    let parentJoint = new THREE.Group();
    parentJoint.position.set(0, 0.95, -0.16); // 從雲台後方伸出
    tailStandGroup.add(parentJoint);

    for (let i = 0; i < segmentCount; i++) {
        const joint = new THREE.Group();
        if (i > 0) joint.position.set(0, 0, -0.34);

        // 關節軸承環
        const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.09 - i * 0.008, 0.09 - i * 0.008, 0.14, 16), tailJointMat);
        ring.rotation.z = Math.PI / 2;
        joint.add(ring);

        // 流線外殼護甲 (扁平寬尾翼造型，更像平衡舵面)
        const width = 0.24 * (1 - i * 0.11);
        const height = 0.10 * (1 - i * 0.10);
        const segmentMesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.30), tailArmorMat);
        segmentMesh.position.set(0, 0, -0.17);
        joint.add(segmentMesh);

        parentJoint.add(joint);
        tailSegments.push(joint);
        parentJoint = joint;
    }

    // 連接線：顯示左側人物重心感測數據傳送到右側機械尾巴
    const linkPoints = [new THREE.Vector3(-1.3, 0.95, 0), new THREE.Vector3(1.3, 0.95, 0.4)];
    const linkGeo = new THREE.BufferGeometry().setFromPoints(linkPoints);
    const linkLine = new THREE.Line(linkGeo, new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.35 }));
    scene.add(linkLine);

    // ================= 4. 控制參數與滑桿連動 =================
    let targetRoll = 0;   // 側傾角度 (-45 ~ +45 度)
    let targetPitch = 0;  // 前後傾角 (-35 ~ +35 度)
    let balanceGain = 1.5;// 平衡補償倍數

    let currentRoll = 0;
    let currentPitch = 0;
    let tailCounterYaw = 0;
    let tailCounterPitch = 0;

    const rollSlider = document.getElementById('rollSlider');
    const pitchSlider = document.getElementById('pitchSlider');
    const gainSlider = document.getElementById('gainSlider');

    function updateUIValues() {
        rollSlider.value = targetRoll;
        pitchSlider.value = targetPitch;
        document.getElementById('rollVal').innerText = targetRoll + '°';
        document.getElementById('pitchVal').innerText = targetPitch + '°';
        document.getElementById('gainVal').innerText = balanceGain.toFixed(1) + 'x';
    }

    rollSlider.oninput = (e) => { targetRoll = parseFloat(e.target.value); clearActiveBtn(); updateUIValues(); };
    pitchSlider.oninput = (e) => { targetPitch = parseFloat(e.target.value); clearActiveBtn(); updateUIValues(); };
    gainSlider.oninput = (e) => { balanceGain = parseFloat(e.target.value); updateUIValues(); };

    function clearActiveBtn() {
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
    }

    document.getElementById('poseIdle').onclick = (e) => {
        targetRoll = 0; targetPitch = 0;
        clearActiveBtn(); e.target.classList.add('active'); updateUIValues();
    };
    document.getElementById('poseLeanL').onclick = (e) => {
        targetRoll = -30; targetPitch = 5;
        clearActiveBtn(); e.target.classList.add('active'); updateUIValues();
    };
    document.getElementById('poseLeanR').onclick = (e) => {
        targetRoll = 30; targetPitch = 5;
        clearActiveBtn(); e.target.classList.add('active'); updateUIValues();
    };

    // ================= 5. ESP32 BLE 藍牙同步模組 =================
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    let bleCharacteristic = null;
    let lastBleSendTime = 0;

    document.getElementById('bleBtn').addEventListener('click', async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Web_Controller' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
            
            const btn = document.getElementById('bleBtn');
            btn.innerText = "已連線 ESP32-C3 (重心平衡同步中)";
            btn.classList.add('connected');
        } catch (err) {
            console.log("藍牙連線取消或失敗:", err);
        }
    });

    async function sendTailToESP32(yawDeg, pitchDeg) {
        if (!bleCharacteristic) return;
        const now = Date.now();
        if (now - lastBleSendTime < 60) return; 
        lastBleSendTime = now;

        try {
            const payload = `${yawDeg},${pitchDeg}`;
            await bleCharacteristic.writeValue(new TextEncoder().encode(payload));
        } catch (e) {
            console.error(e);
        }
    }

    // ================= 6. 重心平衡物理計算主迴圈 =================
    function animate() {
        requestAnimationFrame(animate);

        // 1. 左側人物模型平滑傾斜
        currentRoll += (targetRoll - currentRoll) * 0.1;
        currentPitch += (targetPitch - currentPitch) * 0.1;

        pivotGroup.rotation.z = -THREE.MathUtils.degToRad(currentRoll);
        pivotGroup.rotation.x = THREE.MathUtils.degToRad(currentPitch);

        // 2. 右側獨立機械尾巴重心平衡補償計算
        // 當人物往左傾 (currentRoll < 0)，機械尾巴往右側甩出 (+Yaw) 以平衡重心
        const desiredTailYawDeg = currentRoll * balanceGain; 
        const rollLiftBonus = Math.abs(currentRoll) * 0.25;
        const desiredTailPitchDeg = (currentPitch * balanceGain * 0.8) + rollLiftBonus;

        tailCounterYaw += (desiredTailYawDeg - tailCounterYaw) * 0.14;
        tailCounterPitch += (desiredTailPitchDeg - tailCounterPitch) * 0.14;

        // 3. 套用至機械尾巴 6 節關節
        const totalYawRad = THREE.MathUtils.degToRad(tailCounterYaw);
        const totalPitchRad = THREE.MathUtils.degToRad(tailCounterPitch);

        tailSegments.forEach((segment, index) => {
            const weight = (1.35 - index * 0.1) / segmentCount;
            segment.rotation.y = totalYawRad * weight;
            segment.rotation.x = totalPitchRad * weight;
        });

        // 4. 輸出舵機角度 (0° ~ 180°，90° 為中立靜止)
        const servoYaw = Math.round(THREE.MathUtils.clamp(90 + tailCounterYaw, 10, 170));
        const servoPitch = Math.round(THREE.MathUtils.clamp(90 + tailCounterPitch, 20, 160));

        const isIdle = Math.abs(currentRoll) < 0.2 && Math.abs(currentPitch) < 0.2;
        const statusText = isIdle 
            ? "待機靜止 (重心置中無動作)" 
            : (currentRoll < -1 ? "人物左側傾 -> 尾巴向右補償" : (currentRoll > 1 ? "人物右側傾 -> 尾巴向左補償" : "前後俯仰重心補償中"));

        document.getElementById('telemetry').innerHTML = 
            `狀態：${statusText}<br>舵機角度 -> 水平: ${servoYaw}° | 垂直: ${servoPitch}°`;

        sendTailToESP32(servoYaw, servoPitch);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
