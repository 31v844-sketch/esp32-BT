<div id="camera-panel">
<div class="cam-title">自由觀察視角 (滑鼠左鍵旋轉 / 滾輪縮放)</div>
<div class="cam-grid">
<button onclick="setCameraView('front',this)">正面視角</button><button onclick="setCameraView('back',this)">背面視角</button><button onclick="setCameraView('top',this)">俯視視角</button>
<button onclick="setCameraView('left',this)">左側視角</button><button onclick="setCameraView('right',this)">右側視角</button><button onclick="setCameraView('iso',this)" class="active">預設斜角</button>
</div></div>

<div id="right-math-panel">
<div class="math-header"><span>即時重心 (CoM) 與計算過程</span><span id="stabilityTag" style="color:#00f5d4">狀態：穩定</span></div>
<div class="compare-grid">
<div class="stat-card"><div class="st-label">無尾巴輔助重心偏移</div><div class="st-val" id="noTailOffsetVal" style="color:#f87171">0.00 cm</div><div class="st-label" id="noTailTorqueVal">傾倒力矩: 0.0 N·m</div></div>
<div class="stat-card with-tail"><div class="st-label">雙雲台尾巴補償後偏移</div><div class="st-val" id="withTailOffsetVal" style="color:#facc15">0.00 cm</div><div class="st-label" id="netTorqueVal">淨剩餘力矩: 0.0 N·m</div></div>
</div>
<div class="formula-box" id="mathProcessBox">載入計算引擎中...</div>
</div>

<div id="wasd-hud">
<div class="hud-top"><span>雙雲台控制 (空白鍵全部歸零 / Shift微調)</span><button id="fineModeBtn">步進：粗調 (2.0°)</button></div>
<div class="dual-pad">
<div class="pad-group"><div class="pad-label" style="color:#00f5d4">青綠雲台一</div>
<div class="key-row"><div class="key-cap" id="key-w" data-key="w">W<span>Tilt1+</span></div></div>
<div class="key-row"><div class="key-cap" id="key-a" data-key="a">A<span>Pan1-</span></div><div class="key-cap" id="key-s" data-key="s">S<span>Tilt1-</span></div><div class="key-cap" id="key-d" data-key="d">D<span>Pan1+</span></div></div></div>
<div class="pad-group"><div class="pad-label" style="color:#f472b6">粉紅雲台二</div>
<div class="key-row"><div class="key-cap" id="key-i" data-key="i">I<span>Tilt2+</span></div></div>
<div class="key-row"><div class="key-cap" id="key-j" data-key="j">J<span>Pan2-</span></div><div class="key-cap" id="key-k" data-key="k">K<span>Tilt2-</span></div><div class="key-cap" id="key-l" data-key="l">L<span>Pan2+</span></div></div></div>
</div></div>

<div id="legend-bar">
<div><span class="dot" style="background:#ef4444"></span>無尾巴質心</div>
<div><span class="dot" style="background:#facc15"></span>含尾巴總質心</div>
<div><span class="dot" style="background:#00f5d4"></span>青綠雲台一</div>
<div><span class="dot" style="background:#f472b6"></span>粉紅雲台二</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x111526,.02);
const camera=new THREE.PerspectiveCamera(48,window.innerWidth/window.innerHeight,.1,100);
let camAngleY=.48,camAngleX=.34,camDist=5.3;
function updateCameraPosition(){camera.position.set(camDist*Math.sin(camAngleY)*Math.cos(camAngleX),1.05+camDist*Math.sin(camAngleX),camDist*Math.cos(camAngleY)*Math.cos(camAngleX));camera.lookAt(0,1,0)}
updateCameraPosition();
window.setCameraView=function(v,b){document.querySelectorAll('#camera-panel button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(v==='front'){camAngleY=0;camAngleX=.12;camDist=5}else if(v==='back'){camAngleY=Math.PI;camAngleX=.18;camDist=5}else if(v==='left'){camAngleY=-Math.PI/2;camAngleX=.15;camDist=5}else if(v==='right'){camAngleY=Math.PI/2;camAngleX=.15;camDist=5}else if(v==='top'){camAngleY=0;camAngleX=1.48;camDist=5.8}else{camAngleY=.48;camAngleX=.34;camDist=5.3}updateCameraPosition()};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);
let isDrag=false,pX=0,pY=0;renderer.domElement.addEventListener('mousedown',e=>{isDrag=true;pX=e.clientX;pY=e.clientY});window.addEventListener('mouseup',()=>isDrag=false);
window.addEventListener('mousemove',e=>{if(!isDrag)return;camAngleY-=(e.clientX-pX)*.01;camAngleX=THREE.MathUtils.clamp(camAngleX+(e.clientY-pY)*.01,-.05,1.52);pX=e.clientX;pY=e.clientY;updateCameraPosition()});
renderer.domElement.addEventListener('wheel',e=>{camDist=THREE.MathUtils.clamp(camDist+e.deltaY*.005,2.2,11);updateCameraPosition()});
scene.add(new THREE.AmbientLight(0xffffff,.8));const dl=new THREE.DirectionalLight(0xffffff,.85);dl.position.set(5,12,7);scene.add(dl);scene.add(new THREE.GridHelper(14,14,0x38bdf8,0x1e293b));

const staticGrayMat=new THREE.MeshStandardMaterial({color:0x64748b,roughness:.65,metalness:.25}),darkGrayMat=new THREE.MeshStandardMaterial({color:0x475569,roughness:.7,metalness:.3}),servoBodyMat=new THREE.MeshStandardMaterial({color:0x0f172a,roughness:.4,metalness:.5}),gimbalFrameMat=new THREE.MeshStandardMaterial({color:0x00f5d4,roughness:.3,metalness:.5}),pinkServoMat=new THREE.MeshStandardMaterial({color:0xf472b6,emissive:0x4a0e2e,roughness:.25,metalness:.4}),movingAxisMat=new THREE.MeshStandardMaterial({color:0x38bdf8,roughness:.25,metalness:.6}),counterMassMat=new THREE.MeshStandardMaterial({color:0xfacc15,roughness:.3,metalness:.5});

// 左側人物模型
const charRoot=new THREE.Group();charRoot.position.set(-1.2,0,0);scene.add(charRoot);
charRoot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,2.5,0)]),new THREE.LineBasicMaterial({color:0x94a3b8,transparent:true,opacity:.45})));
const bodyPivot=new THREE.Group();charRoot.add(bodyPivot);
function createShirtTex(){const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');x.fillStyle='#f5f2e9';x.fillRect(0,0,256,256);x.fillStyle='#f9c74f';x.fillRect(78,55,100,72);x.strokeStyle='#d62828';x.lineWidth=6;x.strokeRect(78,55,100,72);return new THREE.CanvasTexture(c)}
const bodyScaler=new THREE.Group();bodyPivot.add(bodyScaler);
const pantsM=new THREE.MeshStandardMaterial({color:0x546e7a}),skinM=new THREE.MeshStandardMaterial({color:0xffdbac}),hairM=new THREE.MeshStandardMaterial({color:0x2b2d42}),shirtM=new THREE.MeshStandardMaterial({map:createShirtTex()});
[-.11,.11].forEach(x=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.075,.065,.78,16),pantsM);l.position.set(x,.42,0);bodyScaler.add(l);const s=new THREE.Mesh(new THREE.BoxGeometry(.13,.07,.24),new THREE.MeshStandardMaterial({color:0x1e293b}));s.position.set(x,.035,.04);bodyScaler.add(s)});
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.19,.165,.62,20),shirtM);torso.scale.set(1.2,1,.75);torso.position.set(0,1.12,0);bodyScaler.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.165,24,24),skinM);head.position.set(0,1.62,0);bodyScaler.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.175,24,24,0,Math.PI*2,0,Math.PI*.55),hairM);hair.position.set(0,1.64,-.01);bodyScaler.add(hair);
[-.27,.27].forEach(x=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(.045,.04,.48,12),skinM);a.position.set(x,1.15,0);a.rotation.z=x<0?.1:-.1;bodyScaler.add(a)});
const noTailSphere=new THREE.Mesh(new THREE.SphereGeometry(.055,20,20),new THREE.MeshBasicMaterial({color:0xef4444}));bodyPivot.add(noTailSphere);
const totalComSphere=new THREE.Mesh(new THREE.SphereGeometry(.072,24,24),new THREE.MeshBasicMaterial({color:0xfacc15}));scene.add(totalComSphere);

// 右側不可動底座 + 雙雲台四舵機
const mechRoot=new THREE.Group();mechRoot.position.set(1.2,0,0);scene.add(mechRoot);
const floorPlate=new THREE.Mesh(new THREE.BoxGeometry(.95,.05,.95),darkGrayMat);floorPlate.position.y=.025;mechRoot.add(floorPlate);
const staticPillar=new THREE.Mesh(new THREE.BoxGeometry(.26,.92,.26),staticGrayMat);staticPillar.position.y=.46;mechRoot.add(staticPillar);
const topMountBlock=new THREE.Mesh(new THREE.BoxGeometry(.42,.12,.38),darkGrayMat);topMountBlock.position.y=.94;mechRoot.add(topMountBlock);
const gimbal1Anchor=new THREE.Group();gimbal1Anchor.position.set(0,1.02,0);mechRoot.add(gimbal1Anchor);

const gimbal1PanGroup=new THREE.Group();gimbal1Anchor.add(gimbal1PanGroup);
gimbal1PanGroup.add(new THREE.Mesh(new THREE.BoxGeometry(.18,.12,.14),servoBodyMat));
const uFrame1=new THREE.Mesh(new THREE.BoxGeometry(.26,.18,.16),gimbalFrameMat);uFrame1.position.y=.12;gimbal1PanGroup.add(uFrame1);
const gimbal1TiltGroup=new THREE.Group();gimbal1TiltGroup.position.set(0,.15,0);gimbal1PanGroup.add(gimbal1TiltGroup);
const s2M=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.16),gimbalFrameMat);s2M.position.x=.14;gimbal1TiltGroup.add(s2M);

const arm1Mesh=new THREE.Mesh(new THREE.CylinderGeometry(.034,.042,1,16),movingAxisMat);arm1Mesh.rotation.x=Math.PI/2;gimbal1TiltGroup.add(arm1Mesh);
const joint2Mount=new THREE.Group();gimbal1TiltGroup.add(joint2Mount);
const gimbal2PanGroup=new THREE.Group();joint2Mount.add(gimbal2PanGroup);
const s3M=new THREE.Mesh(new THREE.BoxGeometry(.16,.13,.15),pinkServoMat);s3M.position.y=.05;gimbal2PanGroup.add(s3M);
const gimbal2TiltGroup=new THREE.Group();gimbal2TiltGroup.position.set(0,.12,0);gimbal2PanGroup.add(gimbal2TiltGroup);
const s4M=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.16,16),counterMassMat);s4M.rotation.z=Math.PI/2;gimbal2TiltGroup.add(s4M);
const arm2Mesh=new THREE.Mesh(new THREE.CylinderGeometry(.024,.032,1,16),movingAxisMat);arm2Mesh.rotation.x=Math.PI/2;gimbal2TiltGroup.add(arm2Mesh);
const tipMass=new THREE.Mesh(new THREE.SphereGeometry(.075,20,20),counterMassMat);gimbal2TiltGroup.add(tipMass);

// 狀態與 ESP-32S 免藍牙自動直連
const state={bodyRoll:0,bodyPitch:0,height:170,weight:65,s1:0,s2:0,s3:0,s4:0,arm1Len:.70,arm2Len:.65,mode:'manual',autoCruise:false,fineStep:false,time:0};
let lastSent='',sending=false;
async function pushToESP32S(){
  const p1=Math.round(90+state.s1),t1=Math.round(90+state.s2),p2=Math.round(90+state.s3),t2=Math.round(90+state.s4);
  const query=`p1=${p1}&t1=${t1}&p2=${p2}&t2=${t2}`;
  if(query===lastSent||sending)return;
  lastSent=query;sending=true;
  try{
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),250);
    await fetch(`http://192.168.4.1/set?${query}`,{mode:'no-cors',signal:ctrl.signal});
    document.getElementById('espLinkState').innerText=`已連線同步 (${p1},${t1},${p2},${t2})`;
    document.getElementById('espLinkState').style.color='#10b981';
  }catch(e){
    document.getElementById('espLinkState').innerText='背景待機 (192.168.4.1)';
    document.getElementById('espLinkState').style.color='#94a3b8';
  }finally{sending=false}
}

// 全部歸零 (含空白鍵快捷鍵)
function resetAllToZero(){
  state.autoCruise=false;state.mode='manual';
  document.getElementById('autoCruiseBtn').classList.remove('active');
  document.getElementById('autoCruiseBtn').innerText='啟動全自動連續巡航導覽';
  document.getElementById('modeManualBtn').classList.add('active');
  document.getElementById('modeAutoCompBtn').classList.remove('active');
  state.bodyRoll=0;state.bodyPitch=0;state.s1=0;state.s2=0;state.s3=0;state.s4=0;
  document.getElementById('bannerTitle').innerText='已執行全部歸零：';
  document.getElementById('bannerText').innerText='所有角度已重設為 0.0° (PWM 90°)';
  updatePhysicsAndUI();
}
document.getElementById('resetBtn').onclick=resetAllToZero;

window.nudgeVal=(k,d)=>{if(state.autoCruise)toggleCruise(false);state[k]=THREE.MathUtils.clamp(state[k]+d,-40,40);updatePhysicsAndUI()};
window.nudgeServo=(idx,d)=>{if(state.autoCruise)toggleCruise(false);if(state.mode==='autocomp')setMode('manual');const k='s'+idx,lim=idx===1?75:idx===2?60:idx===3?85:80;state[k]=THREE.MathUtils.clamp(state[k]+d,-lim,lim);updatePhysicsAndUI()};

function setMode(m){
  state.mode=m;
  document.getElementById('modeManualBtn').classList.toggle('active',m==='manual');
  document.getElementById('modeAutoCompBtn').classList.toggle('active',m==='autocomp');
  if(m==='autocomp'){
    document.getElementById('bannerTitle').innerText='雙級獨立補償啟動：';
    document.getElementById('bannerText').innerText='青綠雲台一粗調定位，粉紅雲台二獨立消弭剩餘力矩';
  }
  updatePhysicsAndUI();
}
document.getElementById('modeManualBtn').onclick=()=>{if(state.autoCruise)toggleCruise(false);setMode('manual')};
document.getElementById('modeAutoCompBtn').onclick=()=>{if(state.autoCruise)toggleCruise(false);setMode('autocomp')};

function toggleCruise(force){
  state.autoCruise=typeof force==='boolean'?force:!state.autoCruise;
  const b=document.getElementById('autoCruiseBtn');
  if(state.autoCruise){b.classList.add('active');b.innerText='停止全自動巡航導覽';state.mode='autocomp';document.getElementById('modeAutoCompBtn').classList.add('active');document.getElementById('modeManualBtn').classList.remove('active')}
  else{b.classList.remove('active');b.innerText='啟動全自動連續巡航導覽'}
}
document.getElementById('autoCruiseBtn').onclick=()=>toggleCruise();

['bodyRoll','bodyPitch','height','weight','s1','s2','s3','s4'].forEach(k=>{
  document.getElementById(k+'Slider').oninput=e=>{
    if(state.autoCruise)toggleCruise(false);
    if(k.startsWith('s')&&state.mode==='autocomp')setMode('manual');
    state[k]=parseFloat(e.target.value);updatePhysicsAndUI();
  };
});
document.getElementById('arm1Slider').oninput=e=>{state.arm1Len=parseFloat(e.target.value);updatePhysicsAndUI()};
document.getElementById('arm2Slider').oninput=e=>{state.arm2Len=parseFloat(e.target.value);updatePhysicsAndUI()};
document.getElementById('fineModeBtn').onclick=()=>{state.fineStep=!state.fineStep;const b=document.getElementById('fineModeBtn');b.classList.toggle('active',state.fineStep);b.innerText=state.fineStep?'步進：微調 (0.5°)':'步進：粗調 (2.0°)'};

// 鍵盤監聽 (包含空白鍵全部歸零)
const keysDown={};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();resetAllToZero();return}
  const k=e.key.toLowerCase();
  if(['w','a','s','d','i','j','k','l'].includes(k)){
    e.preventDefault();if(state.autoCruise)toggleCruise(false);if(state.mode==='autocomp')setMode('manual');
    keysDown[k]=true;const el=document.getElementById('key-'+k);if(el)el.classList.add('pressed');
  }
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keysDown[k]=false;const el=document.getElementById('key-'+k);if(el)el.classList.remove('pressed')});
document.querySelectorAll('.key-cap').forEach(el=>{const k=el.dataset.key;el.onmousedown=()=>{if(state.autoCruise)toggleCruise(false);if(state.mode==='autocomp')setMode('manual');keysDown[k]=true;el.classList.add('pressed')};el.onmouseup=()=>{keysDown[k]=false;el.classList.remove('pressed')};el.onmouseleave=()=>{keysDown[k]=false;el.classList.remove('pressed')}});

function updatePhysicsAndUI(){
  const g=9.81,M=state.weight,hScale=state.height/170;
  bodyScaler.scale.set(1,hScale,1);
  const rRad=THREE.MathUtils.degToRad(state.bodyRoll),pRad=THREE.MathUtils.degToRad(state.bodyPitch);
  bodyPivot.rotation.z=-rRad;bodyPivot.rotation.x=pRad;

  const comH=.95*hScale;
  noTailSphere.position.set(0,comH,0);
  const hWorld=new THREE.Vector3();noTailSphere.getWorldPosition(hWorld);
  const hx=hWorld.x-charRoot.position.x,hy=hWorld.y,hz=hWorld.z-charRoot.position.z;

  const m1=2.2,m2=2.6,L1=state.arm1Len,L2=state.arm2Len;
  if(state.mode==='autocomp'){
    const tTx=-(M*hx)/(m1+m2),tTz=-(M*hz)/(m1+m2);
    const tLat=Math.hypot(tTx,tTz),tPan=tLat>.002?THREE.MathUtils.radToDeg(Math.atan2(tTx,-tTz)):0;
    const maxR1=L1*.75;state.s1=THREE.MathUtils.clamp(tPan,-75,75);
    const p1Ratio=THREE.MathUtils.clamp(tLat/maxR1,0,1);state.s2=THREE.MathUtils.clamp((1-p1Ratio)*55,-60,60);

    const p1R=THREE.MathUtils.degToRad(state.s1),t1R=THREE.MathUtils.degToRad(state.s2);
    const r1=L1*Math.cos(t1R),j2x=r1*Math.sin(p1R),j2z=-r1*Math.cos(p1R);
    const c1x=.5*j2x,c1z=.5*j2z;
    const remX=-(M*hx+m1*c1x)/m2-j2x,remZ=-(M*hz+m1*c1z)/m2-j2z;
    const remLat=Math.hypot(remX,remZ);
    const absPan2=remLat>.001?THREE.MathUtils.radToDeg(Math.atan2(remX,-remZ)):state.s1;
    let relPan2=absPan2-state.s1;while(relPan2>180)relPan2-=360;while(relPan2<-180)relPan2+=360;
    state.s3=THREE.MathUtils.clamp(relPan2,-85,85);
    const r2Ratio=THREE.MathUtils.clamp(remLat/L2,0,1);
    state.s4=THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(Math.acos(r2Ratio))-state.s2,-80,80);
  }

  arm1Mesh.scale.set(1,L1,1);arm1Mesh.position.set(0,0,-L1/2);joint2Mount.position.set(0,0,-L1);
  arm2Mesh.scale.set(1,L2,1);arm2Mesh.position.set(0,0,-L2/2);tipMass.position.set(0,0,-L2);
  gimbal1PanGroup.rotation.y=-THREE.MathUtils.degToRad(state.s1);gimbal1TiltGroup.rotation.x=THREE.MathUtils.degToRad(state.s2);
  gimbal2PanGroup.rotation.y=-THREE.MathUtils.degToRad(state.s3);gimbal2TiltGroup.rotation.x=THREE.MathUtils.degToRad(state.s4);

  const p1R=THREE.MathUtils.degToRad(state.s1),t1R=THREE.MathUtils.degToRad(state.s2);
  const p2R=THREE.MathUtils.degToRad(state.s1+state.s3),t2R=THREE.MathUtils.degToRad(state.s2+state.s4);
  const c1x=.5*L1*Math.cos(t1R)*Math.sin(p1R),c1y=1.17+.5*L1*Math.sin(t1R),c1z=-.5*L1*Math.cos(t1R)*Math.cos(p1R);
  const j2x=L1*Math.cos(t1R)*Math.sin(p1R),j2y=1.17+L1*Math.sin(t1R),j2z=-L1*Math.cos(t1R)*Math.cos(p1R);
  const c2x=j2x+L2*Math.cos(t2R)*Math.sin(p2R),c2y=j2y+L2*Math.sin(t2R),c2z=j2z-L2*Math.cos(t2R)*Math.cos(p2R);

  const totM=M+m1+m2;
  const cx=(M*hx+m1*c1x+m2*c2x)/totM,cy=(M*hy+m1*c1y+m2*c2y)/totM,cz=(M*hz+m1*c1z+m2*c2z)/totM;
  totalComSphere.position.set(charRoot.position.x+cx,cy,charRoot.position.z+cz);

  const noOff=Math.hypot(hx,hz),wOff=Math.hypot(cx,cz);
  const noTq=M*g*noOff,netTq=totM*g*wOff;

  document.getElementById('bodyRollVal').innerText=state.bodyRoll.toFixed(1)+'°';
  document.getElementById('bodyPitchVal').innerText=state.bodyPitch.toFixed(1)+'°';
  document.getElementById('hwVal').innerText=`${state.height}cm / ${state.weight}kg`;
  document.getElementById('s1Val').innerText=`${state.s1.toFixed(1)}° (PWM ${Math.round(90+state.s1)}°)`;
  document.getElementById('s2Val').innerText=`${state.s2.toFixed(1)}° (PWM ${Math.round(90+state.s2)}°)`;
  document.getElementById('s3Val').innerText=`${state.s3.toFixed(1)}° (PWM ${Math.round(90+state.s3)}°)`;
  document.getElementById('s4Val').innerText=`${state.s4.toFixed(1)}° (PWM ${Math.round(90+state.s4)}°)`;
  document.getElementById('armLenVal').innerText=`${L1.toFixed(2)}m / ${L2.toFixed(2)}m`;

  ['bodyRoll','bodyPitch','s1','s2','s3','s4'].forEach(k=>document.getElementById(k+'Slider').value=state[k]);

  document.getElementById('noTailOffsetVal').innerText=(noOff*100).toFixed(2)+' cm';
  document.getElementById('noTailTorqueVal').innerText='傾倒力矩: '+noTq.toFixed(1)+' N·m';
  document.getElementById('withTailOffsetVal').innerText=(wOff*100).toFixed(2)+' cm';
  document.getElementById('netTorqueVal').innerText='淨剩餘力矩: '+netTq.toFixed(1)+' N·m';

  const tag=document.getElementById('stabilityTag');
  if(wOff<.03){tag.innerText='狀態：重心完美平衡';tag.style.color='#00f5d4'}
  else if(wOff<.12){tag.innerText='狀態：安全穩定區';tag.style.color='#facc15'}
  else{tag.innerText='警告：重心偏移過大';tag.style.color='#ef4444'}

  document.getElementById('mathProcessBox').innerHTML=`
    <div><span class="hl-red">[1] 無尾巴質心偏移：</span>X=${(hx*100).toFixed(1)}cm, Z=${(hz*100).toFixed(1)}cm</div>
    <div><span class="hl-cyan">[2] 青綠雲台一 (m1=${m1}kg)：</span>X=${(c1x*100).toFixed(1)}cm, Z=${(c1z*100).toFixed(1)}cm</div>
    <div><span class="hl-pink">[3] 粉紅雲台二 (m2=${m2}kg)：</span>X=${(c2x*100).toFixed(1)}cm, Z=${(c2z*100).toFixed(1)}cm</div>
    <hr style="border:0;border-top:1px dashed #334155;margin:5px 0">
    <div><span class="hl-yellow">[4] 總質心合成 (M_tot=${totM.toFixed(1)}kg)：</span></div>
    <div>X_total = (${M}×${hx.toFixed(2)} + ${m1}×${c1x.toFixed(2)} + ${m2}×${c2x.toFixed(2)}) / ${totM.toFixed(1)} = <span class="hl-yellow">${(cx*100).toFixed(2)} cm</span></div>
    <div>Z_total = (${M}×${hz.toFixed(2)} + ${m1}×${c1z.toFixed(2)} + ${m2}×${c2z.toFixed(2)}) / ${totM.toFixed(1)} = <span class="hl-yellow">${(cz*100).toFixed(2)} cm</span></div>
  `;
  pushToESP32S();
}

function animate(){
  requestAnimationFrame(animate);
  if(state.autoCruise){
    state.time+=.02;
    state.bodyRoll=24*Math.sin(state.time*.85);
    state.bodyPitch=16*Math.sin(state.time*1.3);
    updatePhysicsAndUI();
  }else{
    const step=state.fineStep?.25:1.1;let ch=false;
    if(keysDown['a']){state.s1=Math.max(-75,state.s1-step);ch=true}
    if(keysDown['d']){state.s1=Math.min(75,state.s1+step);ch=true}
    if(keysDown['w']){state.s2=Math.min(60,state.s2+step);ch=true}
    if(keysDown['s']){state.s2=Math.max(-60,state.s2-step);ch=true}
    if(keysDown['j']){state.s3=Math.max(-85,state.s3-step);ch=true}
    if(keysDown['l']){state.s3=Math.min(85,state.s3+step);ch=true}
    if(keysDown['i']){state.s4=Math.min(80,state.s4+step);ch=true}
    if(keysDown['k']){state.s4=Math.max(-80,state.s4-step);ch=true}
    if(ch)updatePhysicsAndUI();
  }
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
updatePhysicsAndUI();animate();
</script>
</body>
</html>
